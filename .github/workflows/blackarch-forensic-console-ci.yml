name: BlackArch Forensic Console CI

on:
  push:
    branches: [blackarch-forensic-console]
  workflow_dispatch:

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Extract clean Rust source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path forensic-src) { Remove-Item -Recurse -Force forensic-src }
          New-Item -ItemType Directory -Path forensic-src | Out-Null
          tar -xf blackarch-forensic-console-source.zip -C forensic-src
          if (!(Test-Path forensic-src\Cargo.toml)) { throw "Cargo.toml not found after extraction" }
          Get-ChildItem forensic-src
      - name: Format check
        run: cargo fmt --manifest-path forensic-src/Cargo.toml --all -- --check
      - name: Unit tests
        run: cargo test --manifest-path forensic-src/Cargo.toml --all
      - name: Clippy
        run: cargo clippy --manifest-path forensic-src/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Optimized release build
        run: cargo build --release --manifest-path forensic-src/Cargo.toml
