name: BlackArch Forensic Console CI

on:
  push:
    branches: [feature/blackarch-forensic-console]
    paths:
      - "blackarch-forensic-console/**"
      - ".github/workflows/blackarch-forensic-console-ci.yml"
  workflow_dispatch:

concurrency:
  group: blackarch-forensic-console-ci
  cancel-in-progress: true

jobs:
  core-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blackarch-forensic-console
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --lib

  windows-build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: blackarch-forensic-console
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --lib
      - run: cargo build --release
      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\assets | Out-Null
          Copy-Item target\release\blackarch-forensic-console.exe dist\BlackArchForensicConsole.exe
          Copy-Item assets\blackarch.ico dist\assets\blackarch.ico
      - uses: actions/upload-artifact@v4
        with:
          name: BlackArchForensicConsole-windows-x64
          path: blackarch-forensic-console/dist/**
          if-no-files-found: error
