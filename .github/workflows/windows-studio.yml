name: Archyter Studio Windows

on:
  push:
    branches: [windows-studio]
  pull_request:
    branches: [windows-studio]

jobs:
  windows-quality:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-windows.txt

      - name: Validate dependency environment
        shell: pwsh
        run: python -m pip check

      - name: Validate PowerShell installers
        shell: pwsh
        run: |
          $files = @(
            "scripts/install_windows.ps1",
            "scripts/run_studio.ps1",
            "scripts/uninstall_windows.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
          }

      - name: Compile sources
        shell: pwsh
        run: python -m compileall -q studio tests_windows

      - name: Run Windows tests
        shell: pwsh
        run: python -m unittest discover -s tests_windows -p "test_*.py" -v

      - name: Render UI smoke image
        shell: pwsh
        run: python tests_windows/render_smoke.py

      - name: Upload UI smoke image
        uses: actions/upload-artifact@v4
        with:
          name: archyter-studio-ui-smoke
          path: artifacts/archyter-studio-smoke.png
          if-no-files-found: error
